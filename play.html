/** 특성 단계: 0 없음, 1 기본, 2 각성 */
function traitTier(G, id) {
  const n = ((G && G.traitLv) || {})[id] || (((G && G.traits) || []).includes(id) ? 1 : 0);
  return n >= TRAIT_AWAKEN ? 2 : n > 0 ? 1 : 0;
}
/** 지금 단계의 특성 수치 (없으면 null) */
function traitVal(G, id) {
  const t = traitTier(G, id);
  return t && TRAITS[id] ? TRAITS[id].lv[t - 1] : null;
}

const ABIL_LABEL = {
  move:'이동', shield:'보호막', heal:'재생', armor:'갑옷', guard:'호위병', tp:'순간이동', push:'밀치기', tilt:'기울임', jam:'마비',
  adapt:'적응', rage:'격노',
};

function abilText(a) {
  if (!a) return '';
  const s = (v) => `${v}초`;
  switch (a.t) {
    case 'move':   return `${ABIL_LABEL.move}: 좌우 ${a.ax}·상하 ${a.ay}px 범위를 움직인다`;
    case 'shield': return `${ABIL_LABEL.shield}: ${s(a.every)}마다 ${a.hits}타를 막는 보호막`;
    case 'heal':   return `${ABIL_LABEL.heal}: ${s(a.every)}마다 최대 HP의 ${Math.round(a.pct * 100)}% 회복`;
    case 'armor':  return `${ABIL_LABEL.armor}: 타격 피해 -${a.flat} (지속 피해는 그대로)`;
    case 'guard':  return `${ABIL_LABEL.guard}: 호위병 ${a.n}기가 주위를 돈다, ${s(a.every)}마다 1기 보충`;
    case 'tp':     return `${ABIL_LABEL.tp}: ${s(a.every)}마다 다른 자리로 이동`;
    case 'push':   return `${ABIL_LABEL.push}: ${s(a.every)}마다 주변 ${a.radius}px 의 공을 밀어냄`;
    case 'tilt':   return `${ABIL_LABEL.tilt}: ${s(a.every)}마다 ${s(a.dur)} 동안 판이 한쪽으로 기움`;
    case 'jam':    return `${ABIL_LABEL.jam}: ${s(a.every)}마다 플리퍼 하나가 ${s(a.dur)} 멈춤`;
    case 'adapt':  return `${ABIL_LABEL.adapt}: ${s(a.every)}마다 ${s(a.dur)} 동안 지금 재질에 저항`;
    case 'rage':   return `${ABIL_LABEL.rage}: HP ${Math.round(a.at * 100)}% 이하에서 능력 간격 ×${a.cdMul}, 이동 ×${a.spdMul}`;
    default:       return ABIL_LABEL[a.t] || a.t;
  }
}

// ───────────────────────── 11. 함수 ─────────────────────────
function worldOf(stage) {
  return Math.max(0, Math.min(WORLDS.length - 1, Math.floor((stage - 1) / CONST.STAGES_PER_WORLD)));
}

function enemyHp(stage, boss) {
  return Math.round(CONST.HP_BASE * Math.pow(CONST.HP_GROWTH, stage - 1) * (boss ? CONST.BOSS_HP_MUL : 1));
}

function makeEnemy(stage) {
  const s = Math.max(1, Math.min(CONST.STAGES, stage | 0));
  const base = JSON.parse(JSON.stringify(ENEMIES[s - 1]));
  const [x, y, r] = base.map.e || CONST.DEFAULT_E;
  const hp = enemyHp(s, !!base.boss);
  const abil = base.abil.map((a) => ({ ...a, timer: a.every || 0, warn: 0, done: false }));
  const guards = [];
  const g = abil.find((a) => a.t === 'guard');
  if (g) {
    for (let i = 0; i < g.n; i++) {
      const ang = (Math.PI * 2 * i) / g.n;
      guards.push({ x: x + Math.cos(ang) * g.orbit, y: y + Math.sin(ang) * g.orbit,
                    r: CONST.GUARD_R, vx: 0, vy: 0, ang, hp: CONST.GUARD_HITS });
    }
  }
  return {
    name: base.name, shape: base.shape, color: base.color, weak: base.weak, resist: base.resist,
    boss: !!base.boss, tip: base.tip || '', stage: s,
    hp, maxHp: hp, x, y, r, x0: x, y0: y, vx: 0, vy: 0, t: 0, tpIdx: 0,
    status: { shield: 0, freeze: 0, freezeCd: 0, burn: 0, burnT: 0, poison: 0, poisonHits: 0,
              tilt: 0, tiltDir: 0, jam: 0, jamSide: '', adapt: 0,
              raged: false },
    abil, guards, map: base.map,
  };
}

function pickWeighted(table, rng) {
  const keys = Object.keys(table).filter((k) => table[k] > 0);
  const total = keys.reduce((s, k) => s + table[k], 0);
  let v = rng() * total;
  for (const k of keys) { v -= table[k]; if (v < 0) return k; }
  return keys[keys.length - 1];
}

function rarityTable(G) {
  const R = CARD_RULES;
  const t = { ...((G.enemy && G.enemy.boss) ? R.bossRarity : R.rarity) };
  const shift = Math.min(R.stageShiftMax, R.stageShift * Math.max(0, (G.stage || 1) - 1));
  const take = Math.min(t.common - 0.05, shift);
  const fromShift = Math.min(shift, take);
  t.common -= take;
  t.rare += fromShift + (take - fromShift) / 2;
  t.epic += (take - fromShift) / 2;
  return t;
}

function rollCards(G, rng = Math.random) {
  const traits = G.traits || [];
  const ups = G.upgrades || {};
  const n = CARD_RULES.count;
  const tlv = G.traitLv || {};
  const next = ENEMIES[G.stage] || null;              // G.stage = 방금 이긴 스테이지 → 다음 적
  const pools = {
    material: Object.keys(MATERIALS).filter((id) => id !== 'normal' && id !== G.material && !(G.materials || []).includes(id)),
    // 가진 특성은 각성 전까지 다시 나옴, 새 특성은 4종까지
    trait: Object.keys(TRAITS).filter((id) => traits.includes(id) ? (tlv[id] || 1) < TRAIT_AWAKEN : traits.length < 4),
    upgrade: Object.keys(UPGRADES).filter((id) => (ups[id] || 0) < UPGRADES[id].max &&
      !(id === 'extraBall' && (G.ballsLeft || 0) >= CONST.MAX_BALLS)),
  };
  const DEF = { material: MATERIALS, trait: TRAITS, upgrade: UPGRADES };
  const cards = [];
  const taken = (kind, id) => cards.some((c) => c.kind === kind && c.id === id);
  const tagOf = (kind, id) => (kind === 'material' && next) ?
    (id === next.weak ? 'weak' : id === next.resist ? 'resist' : undefined) : undefined;
  const push = (kind, id) => {
    const c = { kind, id, rarity: DEF[kind][id].rarity };
    const tag = tagOf(kind, id);
    if (tag) c.tag = tag;
    if (kind === 'trait' && traits.includes(id)) c.stack = (tlv[id] || 1) + 1;   // 고르면 몇 번째가 되는지
    cards.push(c);
  };

  if (next && pools.material.includes(next.weak) && rng() < CARD_RULES.weakHint) push('material', next.weak);
  const own = pools.trait.filter((id) => traits.includes(id));
  if (own.length && rng() < CARD_RULES.ownedTrait) push('trait', own[Math.floor(rng() * own.length) % own.length]);

  const rt = rarityTable(G);
  let guard = 0;
  while (cards.length < n && guard++ < 50) {
    const kinds = {};
    for (const k of Object.keys(CARD_RULES.kind)) {
      if (pools[k].some((id) => !taken(k, id))) kinds[k] = CARD_RULES.kind[k];
    }
    if (!Object.keys(kinds).length) break;
    const kind = pickWeighted(kinds, rng);
    const rarity = pickWeighted(rt, rng);
    const free = pools[kind].filter((id) => !taken(kind, id));
    const same = free.filter((id) => DEF[kind][id].rarity === rarity);
    const list = same.length ? same : free;
    push(kind, list[Math.floor(rng() * list.length) % list.length]);
  }
  return cards;
}

// 특성·강화·재질을 합친 최종 수치 → main.js 가 카드 선택 후 G.stats = calcStats(G)

    dmgMul: 1 + lv('power') * UPGRADES.power.dmgMul,
    critChance: Math.min(CONST.CRIT_CAP, DAMAGE.critChance + (gm ? gm.crit : 0) + lv('critRate') * UPGRADES.critRate.critAdd),
    critMul: DAMAGE.critMul + (gm ? gm.critMul : 0) + lv('critDmg') * UPGRADES.critDmg.critMul,
    missMul: gm ? gm.miss : 1,                                   // 치명이 아닐 때 배수 (도박사)
    bumperMul: (1 + lv('bumperUp') * UPGRADES.bumperUp.bumperMul) * (sp === 'bouncy' ? mm(STATUS.bouncy.bumperMul) : 1),
    laneMul: (1 + lv('laneUp') * UPGRADES.laneUp.laneMul) * (sp === 'gale' ? mm(STATUS.gale.laneMul) : 1),
    targetMul: (1 + (gi ? gi.add : 0) + lv('targetUp') * UPGRADES.targetUp.targetMul) * (sp === 'heavy' ? mm(STATUS.heavy.targetMul) : 1),
    bodyMul: (1 + (gi ? gi.add : 0)) * (sp === 'heavy' ? mm(STATUS.heavy.bodyMul) : 1),
    dotMul: 1 + lv('dotUp') * UPGRADES.dotUp.dotMul,
    weakMul: DAMAGE.weakMul + (el ? el.weak : 0),
    resistMul: DAMAGE.resistMul,
    armorCut: 0,
    armorMul: 1,
    shieldHits: 1 + (sp === 'heavy' ? STATUS.heavy.shieldHits - 1 : 0),
    guardHits: sp === 'heavy' ? 2 : 1,
    forceMul: (sp === 'heavy' ? STATUS.heavy.forceMul : 1) * (ca ? ca.force : 1),
    jamImmune: false,
    adaptImmune: !!(ca && ca.adapt),
    cdMul: 1,
    healCut: 0,                // 회복량 ×(1-healCut); 독 스택>0 이면 추가로 ×(1-STATUS.poison.healCut)
    ballR: CONST.BALL_R * (gi ? gi.size : 1),
    maxSpeed: CONST.MAX_SPEED * (sp === 'heavy' ? STATUS.heavy.speedMul : 1) * (sp === 'gale' ? STATUS.gale.speedMul : 1),
    kickMul: sp === 'bouncy' ? mm(STATUS.bouncy.kickMul) : 1,
    targetReset: CONST.TARGET_RESET,
    freezeChance: sp === 'freeze' ? STATUS.freeze.chance * specialScale : 0,
    chainMul: sp === 'chain' ? STATUS.chain.mul * specialScale : 0,
    saveSec: lv('safety') * UPGRADES.safety.saveSec,
    // 특성 수치 (null = 없음) — 쓰는 곳: main.js
    comet: V('comet'), echo: V('echo'), domino: V('domino'), feather: V('feather'),
    rainbow: V('rainbow'), piggy: V('piggy'), fury: V('fury'), reaper: V('reaper'), twin: V('twin'),
    blast: V('blast'), cell: V('cell'),

}

// 바운스 브레이커 — 이벤트 버스 (리드 소유, docs/구조.md 4장 참고)
const handlers = new Map();

const bus = {
  on(name, fn) {
    if (!handlers.has(name)) handlers.set(name, []);
    handlers.get(name).push(fn);
    return () => bus.off(name, fn);
  },
  off(name, fn) {
    const list = handlers.get(name);
    if (!list) return;
    const i = list.indexOf(fn);
    if (i >= 0) list.splice(i, 1);
  },
  emit(name, data = {}) {
    const list = handlers.get(name);
    if (!list) return;
    for (const fn of list.slice()) {
      try { fn(data); } catch (e) { console.error(`[bus ${name}]`, e); }
    }
  },
};

const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ }
  },
};

return { bus, store };

    const text = d.kind === 'shield' ? '막음' : `${st.pre || ''}${Math.round(d.amount || 0)}${st.suf || ''}`;
    addFloat({ x: (d.x ?? W / 2) + (Math.random() * 16 - 8), y: (d.y ?? 150) - 6, text, c, s: st.s, life: 0.85, max: 0.85 });
  });
  bus.on('ability', (d) => {
    if (!d) return;
    banners.push({ x: d.x ?? W / 2, y: (d.y ?? 140) - 50, text: d.label || d.t || '', c: '#ff9f5a', s: 18, life: 1.3, max: 1.3 });
  });
  bus.on('enemyDefeated', (d) => {
    death = { boss: !!(d && d.boss), bonus: (d && d.bonus) || 0, burst: false, pops: 0 };
    banners.length = 0;                                  // 판 안내 등 남은 글자 지움
    for (const b of (d && d.balls) || []) addParts(b.x, b.y, 6, '#ffffff', 120);   // 공은 반짝이며 사라짐
  });
  bus.on('ballLost', (d) => {
    if (d && (d.saved || d.left < 0)) return;          // SAVE 는 G.saveFlash 로 표시, 게임오버는 UI 화면
    banners.push({ x: W / 2, y: 520, text: '공 소실', c: '#ff7070', s: 18, life: 1.0, max: 1.0 });
  });
  bus.on('bump', (d) => {
    if (!d || d.type === 'wall' || d.type === 'lane') return;
    const c = d.type === 'sling' ? '#ff8a5c' : d.type === 'target' ? '#ffd84a' : '#ffffff';
    addParts(d.x, d.y, d.type === 'flipper' ? 2 : 4, c, 140);
  });
  bus.on('traitAwake', (d) => {
    const t = d && TRAITS[d.id];
    if (!t) return;
    banners.push({ x: W / 2, y: 250, text: `★ ${t.name} 각성! ★`, c: '#ffd84a', s: 22, life: 2.6, max: 2.6 });
    banners.push({ x: W / 2, y: 276, text: t.star, c: '#fff3b0', s: 12, life: 2.6, max: 2.6 });
    for (let i = 0; i < 4; i++) addParts(W / 2 - 90 + i * 60, 260, 6, i % 2 ? '#ffd84a' : '#ffffff', 200);
  });
  bus.on('blast', (d) => {
    if (!d) return;
    rings.push({ x: d.x, y: d.y, r: d.r || 70, life: 0.45, max: 0.45 });
    addParts(d.x, d.y, 14, '#ffb030', 260); addParts(d.x, d.y, 8, '#ff4a2a', 200); addParts(d.x, d.y, 4, '#ffffff', 160);
  });
  bus.on('cellPop', (d) => { if (d) addParts(d.x, d.y, 8, '#9dffa8', 150); });
  bus.on('crumble', (d) => {
    if (!d) return;
    const sk = curSkin;
    addParts(d.x, d.y, 10, sk.body, 220); addParts(d.x, d.y, 6, sk.dark, 180);
    banners.push({ x: d.x, y: d.y - 30, text: '와장창!', c: sk.mark, s: 16, life: 0.9, max: 0.9 });
  });
}

function resizeRender(v) {
  if (v) view = { ...view, ...v };
}

// ───────────── 작은 도구 ─────────────
function capsule(x1, y1, x2, y2, r, color) {
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, (r || 3) * 2); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function poly(x, y, r, n, rot, fill) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * TAU;
    i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
const snap = (v) => Math.round(v / PX) * PX;
function sq(cx, cy, size, color) {          // 도트 칸에 맞춘 정사각형
  const s = Math.max(PX, snap(size));
  ctx.fillStyle = color; ctx.fillRect(snap(cx - s / 2), snap(cy - s / 2), s, s);
}
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(snap(x), snap(y), Math.max(PX, snap(w)), Math.max(PX, snap(h))); }
// 글자는 덧그리기 목록에 넣는다
function text(t, x, y, size, color, align = 'center') { texts.push({ k: 't', t, x, y, size, color, align }); }

function rgb(hex) {
  const h = (hex || '#ffffff').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function hexA(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) {
  const a = rgb(h1), b = rgb(h2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const arr = (a) => (Array.isArray(a) ? a : []);
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v) ? v : d);

// 4×4 Bayer: 알파가 문턱보다 크면 불투명, 아니면 투명 → 반투명은 점무늬, 경계는 계단
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => ((v + 0.5) / 16) * 255);
function crisp(c2d, w, h) {
  const img = c2d.getImageData(0, 0, w, h), d = img.data;
  for (let y = 0, i = 0; y < h; y++) {
    const row = (y & 3) << 2;
    for (let x = 0; x < w; x++, i += 4) {
      const a = d[i + 3];
      if (a === 0 || a === 255) continue;
      d[i + 3] = a > BAYER[row | (x & 3)] ? 255 : 0;
    }
  }
  c2d.putImageData(img, 0, 0);
}
function rng(seed) {            // 고정 무늬용 난수
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ───────────── 고정 층: 도트 배경 + 벽 ─────────────
function paintBackground(g, world, wi) {
  const img = g.createImageData(BW, BH), d = img.data;
  const c0 = rgb(world.bg[0]), c1 = rgb(world.bg[1]), N = 7;
  const band = [];
  for (let k = 0; k < N; k++) band.push(c0.map((v, i) => Math.round(v + (c1[i] - v) * (k / (N - 1)))));
  for (let y = 0, i = 0; y < BH; y++) {
    const t = (y / (BH - 1)) * (N - 1), k = Math.floor(t), f = (t - k) * 255;
    for (let x = 0; x < BW; x++, i += 4) {
      const c = band[Math.min(N - 1, f > BAYER[((y & 3) << 2) | (x & 3)] ? k + 1 : k)];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const R = rng(1234 + wi * 77), L = world.line, base = world.bg[1];
  const dot = (x, y, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); };
  const plus = (x, y, c) => { dot(x, y, c); dot(x - 1, y, c); dot(x + 1, y, c); dot(x, y - 1, c); dot(x, y + 1, c); };
  switch (world.id) {
    case 'moss':
      for (let i = 0; i < 160; i++) dot(R() * BW, R() * BH, mix(base, L, 0.18 + R() * 0.12));
      for (let i = 0; i < 34; i++) { const x = R() * BW, y = R() * BH, c = mix(base, L, 0.35); dot(x, y, c); dot(x - 1, y - 1, c); dot(x + 1, y - 1, c); dot(x, y - 2, c); }
      break;
    case 'sand':
      for (let k = 0; k < 16; k++) {
        const by = 12 + k * 21, c = mix(base, L, 0.16);
        for (let x = 0; x < BW; x++) dot(x, by + Math.round(2.5 * Math.sin(x / 9 + k * 1.3)), c);
      }
      for (let i = 0; i < 140; i++) dot(R() * BW, R() * BH, mix(base, L, 0.22));
      break;
    case 'ice':
      for (let i = 0; i < 36; i++) plus(2 + R() * (BW - 4), 2 + R() * (BH - 4), mix(base, L, 0.35));
      for (let i = 0; i < 18; i++) { const x = R() * BW, y = R() * BH, c = mix(base, L, 0.2); for (let j = 0; j < 6; j++) dot(x + j, y + j, c); }
      for (let i = 0; i < 70; i++) dot(R() * BW, R() * BH, mix(base, '#ffffff', 0.25));
      break;
    case 'forge': {
      const c = mix(base, L, 0.13);
      for (let y = 0; y < BH; y += 8) {
        for (let x = 0; x < BW; x++) dot(x, y, c);
        for (let x = ((y / 8) % 2) * 8; x < BW; x += 16) for (let j = 1; j < 8; j++) dot(x, y + j, c);
      }
      for (let i = 0; i < 46; i++) dot(R() * BW, R() * BH, mix(base, '#ff8a3d', 0.5 + R() * 0.3));
      break;
    }
    default: // spire — 별과 회로
      for (let i = 0; i < 130; i++) dot(R() * BW, R() * BH, mix(base, '#ffffff', 0.25 + R() * 0.45));
      for (let i = 0; i < 12; i++) plus(2 + R() * (BW - 4), 2 + R() * (BH - 4), mix(base, L, 0.6));
      for (let i = 0; i < 8; i++) {
        let x = R() * BW | 0, y = R() * BH | 0; const c = mix(base, L, 0.15);
        for (let j = 0; j < 30; j++) { dot(x, y, c); if (R() < 0.15) { if (R() < 0.5) x++; else y++; } else if (j % 10 < 5) x++; else y++; }
      }
  }
}

function buildStatic(b, world, wi) {
  const c = mk(BW, BH), g = c.getContext('2d');
  paintBackground(g, world, wi);
  // 벽: 투명 층에 그린 뒤 도트화해서 얹는다
  const wl = mk(BW, BH), wg = wl.getContext('2d', { willReadFrequently: true });
  const keep = ctx; ctx = wg;
  ctx.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0);
  const line = world.line, dark = mix(line, '#000000', 0.62), lite = mix(line, '#ffffff', 0.55);
  // 발사 레인 바닥
  if (b.lane) {
    const L = b.lane;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(num(L.x1, 345), num(L.y1, 100), num(L.x2, 375) - num(L.x1, 345), num(L.y2, 650) - num(L.y1, 100));
  }
  const walls = arr(b.walls).filter((w) => !w.gate);
  for (const w of walls) capsule(w.x1, w.y1, w.x2, w.y2, num(w.r, 4) + 1.6, dark);
  for (const w of walls) capsule(w.x1, w.y1, w.x2, w.y2, num(w.r, 4), w.map ? mix(line, world.bg[1], 0.25) : line);
  for (const w of walls) capsule(w.x1 - 1, w.y1 - 1.5, w.x2 - 1, w.y2 - 1.5, 1, w.map ? hexA(lite, 0.6) : lite);
  for (const w of arr(b.walls).filter((q) => q.gate)) {
    ctx.setLineDash([4, 4]); capsule(w.x1, w.y1, w.x2, w.y2, 1.5, hexA(line, 0.6)); ctx.setLineDash([]);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx = keep;
  crisp(wg, BW, BH);
  g.drawImage(wl, 0, 0);
  return c;
}

// ───────────── 움직이는 판 요소 ─────────────
let curSkin = SKIN.moss;

function drawBoard(G, b, world, t) {
  const line = world.line;
  // 발사대·충전 게이지
  if (b.lane) {
    const L = b.lane, x1 = num(L.x1, 348), x2 = num(L.x2, 372), y2 = num(L.y2, 650);
    const ch = num(G.plunger && G.plunger.charge);
    const py = (b.plunger ? num(b.plunger.y, y2 - 13) + 11 : y2 - 22) + ch * 18;
    rect(x1 + 4, py, x2 - x1 - 8, 6, '#c8ccd2');
    rect(x1 + 4, py + 4, x2 - x1 - 8, 2, '#8a9098');
    rect(x1 + (x2 - x1) / 2 - 2, py + 6, 4, Math.max(0, y2 + 30 - py - 6), '#6b7178');
    if (G.phase === 'launch' || ch > 0) {
      const gh = 110, gx = x1 - 12, gy = y2 - gh - 10;
      rect(gx - 2, gy - 2, 10, gh + 4, '#000000');
      const n = 10, filled = Math.round(ch * n);
      for (let i = 0; i < n; i++) {
        const on = i < filled;
        const c = i >= 8 ? '#ff5a4a' : i >= 5 ? '#ffd84a' : '#7be08a';
        rect(gx, gy + gh - (i + 1) * 11 + 2, 6, 8, on ? c : 'rgba(255,255,255,.12)');
      }
    }
  }
  // 레인 (통과형)
  for (const l of arr(b.lanes)) {
    const lit = num(l.lit);
    ctx.fillStyle = hexA(line, 0.14 + lit * 0.6); ctx.fillRect(l.x, l.y, l.w, l.h);
    ctx.strokeStyle = lit > 0.05 ? '#ffffff' : mix(line, '#000000', 0.2); ctx.lineWidth = 2; ctx.strokeRect(l.x, l.y, l.w, l.h);
    const cx = l.x + l.w / 2, cy = l.y + l.h / 2, blink = Math.floor(t * 3) % 2;
    ctx.strokeStyle = lit > 0.05 ? '#ffffff' : hexA(line, blink ? 0.95 : 0.55); ctx.lineWidth = 2.5; ctx.lineCap = 'butt'; ctx.beginPath();
    ctx.moveTo(cx - 5, cy + 4); ctx.lineTo(cx, cy - 2); ctx.lineTo(cx + 5, cy + 4); ctx.stroke();
  }
  // 슬링샷
  for (const s of arr(b.slings)) {
    const f = num(s.flash), r = num(s.r, 5);
    capsule(s.x1, s.y1, s.x2, s.y2, r + 1.6, '#5a1e0a');
    capsule(s.x1, s.y1, s.x2, s.y2, r, f > 0.05 ? '#ffffff' : '#ff8a5c');
  }
  // 드롭 타깃
  for (const tg of arr(b.targets)) {
    if (tg.down) { capsule(tg.x1, tg.y1, tg.x2, tg.y2, 1.5, hexA(line, 0.4)); continue; }
    const r = num(tg.r, 5);
    capsule(tg.x1, tg.y1, tg.x2, tg.y2, r + 1.6, '#4a3a00');
    capsule(tg.x1, tg.y1, tg.x2, tg.y2, r, num(tg.flash) > 0.05 ? '#ffffff' : '#ffd84a');
    capsule(tg.x1, tg.y1 - 1.5, tg.x2, tg.y2 - 1.5, 1, '#fff3b0');
  }
  // 장애물
  for (const p of arr(b.bumpers)) drawObstacle(p, b.gimmick, t);
}

function drawBumperBody(x, y, r, f, t, sk) {
  const body = f > 0.05 ? '#ffffff' : sk.body;
  switch (sk.deco) {
    case 'rock':
      poly(x, y, r + 1.8, 8, Math.PI / 8, sk.dark);
      poly(x, y, r, 8, Math.PI / 8, body);
      poly(x - r * 0.2, y - r * 0.25, r * 0.55, 8, Math.PI / 8, mix(body, '#ffffff', 0.25));
      capsule(x - r * 0.1, y + r * 0.1, x + r * 0.45, y + r * 0.5, 0.9, sk.dark);
      break;
    case 'crystal':
      poly(x, y, r + 2, 6, Math.PI / 6, sk.dark);
      poly(x, y, r, 6, Math.PI / 6, body);
      poly(x - r * 0.15, y - r * 0.15, r * 0.5, 6, Math.PI / 6, sk.mark);
      capsule(x + r * 0.2, y - r * 0.6, x + r * 0.55, y - r * 0.1, 0.9, sk.mark);
      break;
    case 'gear': {
      const n = 8, rot = t * 0.8;
      for (let i = 0; i < n; i++) {
        const a = rot + (i / n) * TAU;
        capsule(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3), 3.4, sk.dark);
      }
      circle(x, y, r + 0.5, sk.dark);
      circle(x, y, r - 1.5, body);
      circle(x, y, r * 0.45, sk.dark);
      circle(x, y, r * 0.28, f > 0.05 ? '#ffffff' : sk.mark);
      break;
    }
    case 'coil':
      circle(x, y, r + 1.8, sk.dark);
      circle(x, y, r, body);
      circle(x, y, r * 0.68, sk.dark);
      circle(x, y, r * 0.48, f > 0.05 ? '#ffffff' : sk.mark);
      if (Math.floor(t * 6) % 3 === 0) {
        const a = Math.floor(t * 6) * 1.9;
        ctx.strokeStyle = sk.mark; ctx.lineWidth = 2; ctx.lineCap = 'butt'; ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(a + 0.3) * (r + 6), y + Math.sin(a + 0.3) * (r + 6));
        ctx.lineTo(x + Math.cos(a - 0.1) * (r + 10), y + Math.sin(a - 0.1) * (r + 10)); ctx.stroke();
      }
      break;
    default: // mushroom — 위에서 본 버섯 갓
      circle(x, y, r + 1.8, sk.dark);
      circle(x, y, r, body);
      circle(x - r * 0.2, y - r * 0.2, r * 0.7, mix(body, '#ffffff', 0.18));
      for (const [dx, dy, k] of [[-0.35, -0.3, 0.22], [0.38, -0.05, 0.18], [-0.05, 0.42, 0.2], [0.1, -0.55, 0.12]]) {
        sq(x + dx * r, y + dy * r, Math.max(PX * 2, r * k * 2), sk.mark);
      }
  }
}

function drawObstacle(p, kind, t) {
  const sk = curSkin, f = num(p.flash), x = p.x, y = p.y, r = num(p.r, 18);
  switch (kind) {
    case 'spin': {
      const gm = GIMMICKS.spin, L = num(p.r0, r) + gm.extra, ca = Math.cos(num(p.ang)) * L, sa = Math.sin(num(p.ang)) * L;
      circle(x, y, L + gm.w, null, hexA(sk.body, 0.22), 2);                       // 회전 범위
      capsule(x - ca, y - sa, x + ca, y + sa, gm.w + 1.8, sk.dark);
      capsule(x - ca, y - sa, x + ca, y + sa, gm.w, f > 0.05 ? '#ffffff' : sk.body);
      capsule(x - ca * 0.9, y - sa * 0.9 - 1.5, x + ca * 0.9, y + sa * 0.9 - 1.5, 1, mix(sk.body, '#ffffff', 0.5));
      sq(x - ca, y - sa, 4, sk.mark); sq(x + ca, y + sa, 4, sk.mark);
      circle(x, y, 7.5, sk.dark); circle(x, y, 5.5, sk.mark); sq(x, y, 2, sk.dark);
      return;
    }
    case 'crumble': {
      if (p.broken > 0) {                   // 잔해 + 다시 생기는 진행 표시
        const k = 1 - p.broken / GIMMICKS.crumble.respawn;
        for (let i = 0; i < 6; i++) { const a = i * 1.05 + p.i; sq(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, 4, mix(sk.body, '#000000', 0.45)); }
        ctx.strokeStyle = hexA(sk.mark, 0.5); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
        return;
      }
      const sk2 = { ...sk, deco: 'rock', body: sk.deco === 'rock' ? sk.body : mix(sk.body, '#9a8a7a', 0.5) };
      drawBumperBody(x, y, r, f, t, sk2);
      const hp = num(p.hp, 3);
      ctx.strokeStyle = sk.dark; ctx.lineWidth = 2; ctx.lineCap = 'butt'; ctx.beginPath();
      if (hp <= 2) { ctx.moveTo(x - r * 0.7, y - r * 0.2); ctx.lineTo(x - r * 0.15, y + r * 0.05); ctx.lineTo(x + r * 0.1, y - r * 0.5); }
      if (hp <= 1) { ctx.moveTo(x + r * 0.7, y + r * 0.1); ctx.lineTo(x + r * 0.1, y + r * 0.25); ctx.lineTo(x - r * 0.1, y + r * 0.75); }
      ctx.stroke();
      for (let i = 0; i < hp; i++) sq(x - (hp - 1) * 3 + i * 6, y + r + 6, 4, sk.mark);   // 남은 타수
      return;
    }
    case 'whirl': {
      const rot = -t * 2.2;
      for (let k = 0; k < 3; k++) {
        const a0 = rot + k * (TAU / 3);
        ctx.strokeStyle = hexA(sk.body, 0.55); ctx.lineWidth = 3; ctx.lineCap = 'butt';
        ctx.beginPath();
        for (let i = 0; i <= 14; i++) {
          const u = i / 14, a = a0 + u * 2.4, rr = r + 6 + u * (GIMMICKS.whirl.range - 10);
          i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.stroke();
      }
      drawBumperBody(x, y, r, f, t, sk);
      return;
    }
    case 'orbit':
      circle(num(p.x0, x), num(p.y0, y), GIMMICKS.orbit.rad, null, hexA(sk.body, 0.35), 2);
      drawBumperBody(x, y, r, f, t, sk);
      return;
    case 'pulse': {
      const k = r / Math.max(1, num(p.r0, r));
      if (k > 1.08) circle(x, y, r + 5, null, hexA(sk.mark, Math.min(0.7, (k - 1) * 3)), 2);
      drawBumperBody(x, y, r, f, t, sk);
      return;
    }
    default:
      drawBumperBody(x, y, r, f, t, sk);
  }
}

function flipperTip(side, fb, gf) {
  if (fb && typeof fb.x2 === 'number') return [fb.x2, fb.y2];
  const len = num(fb.len, 62);
  let a = gf && typeof gf.angle === 'number' ? gf.angle : null;
  if (a == null && typeof fb.rest === 'number') a = fb.rest;
  if (a == null) { const rest = (30 * Math.PI) / 180; a = side === 'L' ? rest : Math.PI - rest; }
  return [fb.px + Math.cos(a) * len, fb.py + Math.sin(a) * len];
}

function drawFlippers(G, b) {
  const F = b.flippers; if (!F) return;
  const jam = G.enemy && G.enemy.status && num(G.enemy.status.jam) > 0 ? G.enemy.status.jamSide : '';
  for (const side of ['L', 'R']) {
    const fb = F[side]; if (!fb || typeof fb.px !== 'number') continue;
    const gf = G.flippers && G.flippers[side];
    const [tx, ty] = flipperTip(side, fb, gf);
    const r = num(fb.r, 8);
    capsule(fb.px, fb.py, tx, ty, r + 1.6, '#1a1e22');
    capsule(fb.px, fb.py, tx, ty, r, jam === side ? '#7a3a3a' : '#e8edf2');
    capsule(fb.px, fb.py, tx, ty, Math.max(1, r - 3), jam === side ? '#b04848' : '#ff6a4d');
    sq(fb.px, fb.py, 4, '#20262c');
    if (jam === side) text('마비', (fb.px + tx) / 2, fb.py - 22, 13, '#ff6a6a');
  }
}

// ───────────── 적 ─────────────
function drawShape(e, t, lookAt) {
  const { x, y } = e, r = num(e.r, 26), col = e.color || '#aaaaaa';
  const dark = mix(col, '#000000', 0.6);
  ctx.beginPath();
  switch (e.shape) {
    case 'box': {
      const s = r * 0.92, k = PX * 2;               // 도트 계단 모서리
      ctx.moveTo(x - s + k, y - s); ctx.lineTo(x + s - k, y - s); ctx.lineTo(x + s - k, y - s + k); ctx.lineTo(x + s, y - s + k);
      ctx.lineTo(x + s, y + s - k); ctx.lineTo(x + s - k, y + s - k); ctx.lineTo(x + s - k, y + s); ctx.lineTo(x - s + k, y + s);
      ctx.lineTo(x - s + k, y + s - k); ctx.lineTo(x - s, y + s - k); ctx.lineTo(x - s, y - s + k); ctx.lineTo(x - s + k, y - s + k);
      break;
    }
    case 'spike': {
      const n = 8, rot = Math.floor(t * 4) * (TAU / 32);   // 한 칸씩 끊어 도는 도트 애니메이션
      for (let i = 0; i <= n * 2; i++) {
        const a = (i / (n * 2)) * TAU + rot, rr = i % 2 ? r * 0.72 : r * 1.1;
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      break;
    }
    case 'ghost': {
      ctx.arc(x, y - r * 0.15, r * 0.9, Math.PI, 0);
      const by = y + r * 0.85, fr = Math.floor(t * 4) % 2;
      ctx.lineTo(x + r * 0.9, by);
      for (let i = 0; i <= 6; i++) ctx.lineTo(x + r * 0.9 - (i / 6) * r * 1.8, by + ((i + fr) % 2 ? -4 : 3));
      break;
    }
    case 'eye':
      ctx.arc(x, y, r, 0, TAU);
      break;
    default: { // blob — 두 장짜리 출렁임
      const n = 24, fr = Math.floor(t * 4) % 2;
      for (let i = 0; i <= n; i++) {
        const a = (i / n) * TAU, rr = r * (1 + 0.07 * Math.sin(a * 3 + fr * Math.PI));
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * (fr ? 0.9 : 0.95);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
    }
  }
  ctx.closePath();
  ctx.strokeStyle = dark; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = col; ctx.fill();
  // 아래쪽 그림자, 위쪽 빛
  ctx.save(); ctx.clip();
  ctx.fillStyle = mix(col, '#000000', 0.28); ctx.fillRect(x - r * 1.3, y + r * 0.45, r * 2.6, r);
  ctx.restore();
  sq(x - r * 0.45, y - r * 0.5, Math.max(4, r * 0.28), mix(col, '#ffffff', 0.55));

  // 눈 (도트 사각형)
  let dx = 0, dy = 0;
  if (lookAt) { const L = Math.hypot(lookAt.x - x, lookAt.y - y) || 1; dx = (lookAt.x - x) / L; dy = (lookAt.y - y) / L; }
  const blinkNow = (t % 3.2) < 0.12;
  if (e.shape === 'eye') {
    circle(x, y, r * 0.62, '#ffffff');
    circle(x + dx * r * 0.22, y + dy * r * 0.22, r * 0.32, col);
    sq(x + dx * r * 0.28, y + dy * r * 0.28, Math.max(4, r * 0.3), '#111111');
    if (blinkNow) rect(x - r * 0.65, y - 2, r * 1.3, 4, dark);
  } else {
    const ey = y - r * 0.12, ex = r * 0.34, es = Math.max(6, snap(r * 0.36));
    for (const s of [-1, 1]) {
      if (blinkNow) { rect(x + s * ex - es / 2, ey, es, PX, '#111111'); continue; }
      sq(x + s * ex, ey, es, '#ffffff');
      sq(x + s * ex + dx * es * 0.25, ey + dy * es * 0.25, Math.max(PX * 2, es / 2), '#111111');
    }
  }
  // 보스 왕관
  if (e.boss) {
    const cy = y - r - 4, cw = r * 0.6;
    ctx.fillStyle = '#7a5a00'; ctx.beginPath();
    ctx.moveTo(x - cw - 2, cy + 2); ctx.lineTo(x - cw - 2, cy - 12); ctx.lineTo(x - cw / 2, cy - 6); ctx.lineTo(x, cy - 15);
    ctx.lineTo(x + cw / 2, cy - 6); ctx.lineTo(x + cw + 2, cy - 12); ctx.lineTo(x + cw + 2, cy + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffcf3a'; ctx.beginPath();
    ctx.moveTo(x - cw, cy); ctx.lineTo(x - cw, cy - 9); ctx.lineTo(x - cw / 2, cy - 3); ctx.lineTo(x, cy - 12);
    ctx.lineTo(x + cw / 2, cy - 3); ctx.lineTo(x + cw, cy - 9); ctx.lineTo(x + cw, cy); ctx.closePath(); ctx.fill();
    sq(x, cy - 4, 4, '#ff4a6a');
  }
}

// 적이 쓰러지는 연출: 떨림·하얀 깜빡임·부풀기 → 펑 (보스는 작은 폭발 여러 번 뒤 큰 폭발)
function drawDying(G, t) {
  const e = G.enemy; if (!e || !death) return;
  const d = num(G.dieT), D = num(G.dieDur, 1.7), r = num(e.r, 26);
  const burstAt = death.boss ? 1.5 : 0.55;
  const col = e.color || '#aaaaaa';
  if (d < burstAt) {
    const k = d / burstAt;
    const amp = (death.boss ? 4 : 2.5) * (0.4 + k);
    const ox = Math.sin(d * 70) * amp, oy = Math.cos(d * 53) * amp * 0.6;
    const white = Math.floor(d * 14) % 2 === 0;
    drawShape({ ...e, x: e.x + ox, y: e.y + oy, r: r * (1 + 0.25 * k), color: white ? '#ffffff' : col, boss: e.boss }, t, null);
    shake = Math.max(shake, death.boss ? 2 + 3 * k : 1.5);
    if (death.boss) {                       // 몸 곳곳에서 작은 폭발
      const n = Math.floor(d / 0.16);
      while (death.pops < n) {
        death.pops++;
        const a = Math.random() * TAU, rr = r * (0.3 + Math.random() * 0.8);
        const px = e.x + Math.cos(a) * rr, py = e.y + Math.sin(a) * rr;
        rings.push({ x: px, y: py, r: 22, life: 0.3, max: 0.3 });
        addParts(px, py, 6, Math.random() < 0.5 ? '#ffb030' : '#ffffff', 180);
      }
    }
    return;
  }
  if (!death.burst) {                       // 펑!
    death.burst = true;
    flash = 1; shake = death.boss ? 10 : 6;
    rings.push({ x: e.x, y: e.y, r: r * 3.2, life: 0.6, max: 0.6 });
    rings.push({ x: e.x, y: e.y, r: r * 1.8, life: 0.4, max: 0.4 });
    addParts(e.x, e.y, death.boss ? 70 : 40, col, death.boss ? 340 : 260);
    addParts(e.x, e.y, 20, mix(col, '#000000', 0.5), 220);
    addParts(e.x, e.y, 16, '#ffffff', 300);
    if (e.boss) addParts(e.x, e.y - r, 14, '#ffcf3a', 240);
    banners.push({ x: W / 2, y: 300, text: death.boss ? '보스 격파!' : '격파!', c: '#ffe45c', s: death.boss ? 34 : 30, life: D - burstAt + 0.3, max: D - burstAt + 0.3 });
    banners.push({ x: W / 2, y: 336, text: `+${death.bonus.toLocaleString()}점`, c: '#9dffa8', s: 16, life: D - burstAt + 0.3, max: D - burstAt + 0.3 });
    if (death.boss) banners.push({ x: W / 2, y: 360, text: '공 +1', c: '#ffffff', s: 14, life: D - burstAt + 0.3, max: D - burstAt + 0.3 });
  }
  // 터진 자리: 연기 고리가 사라져 감
  const k = Math.min(1, (d - burstAt) / Math.max(0.1, D - burstAt));
  circle(e.x, e.y, r * (1.2 + k), null, hexA(col, 0.5 * (1 - k)), 3);
}

function drawEnemy(G, t) {
  const e = G.enemy; if (!e || typeof e.x !== 'number') return;
  if (G.phase === 'dying') { drawDying(G, t); return; }
  const st = e.status || {}, r = num(e.r, 26);
  const ball = arr(G.balls).find((b) => b && b.alive !== false);

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + r * 0.95, r * 0.8, r * 0.25, 0, 0, TAU); ctx.fill();

  // 호위병
  for (const g of arr(e.guards)) {
    const gr = num(g.r, 10);
    circle(g.x, g.y, gr + 1.6, '#1d2228'); circle(g.x, g.y, gr, '#5b6470');
    circle(g.x - 2, g.y - 2, gr * 0.5, '#8a94a0');
    const hp = num(g.hp, 2);
    for (let i = 0; i < hp; i++) sq(g.x - (hp - 1) * 3 + i * 6, g.y + 1, 2, '#ffffff');
  }

  drawShape(e, t, ball);

  // 상태 외형
  if (num(st.freeze) > 0) { circle(e.x, e.y, r + 2, 'rgba(190,235,255,.5)', '#e8fbff', 3); }
  if (num(st.shield) > 0) circle(e.x, e.y, r + 8, 'rgba(108,200,255,.2)', '#6cc8ff', 3);
  if (num(st.adapt) > 0) {
    ctx.setLineDash([6, 5]); circle(e.x, e.y, r + 13, null, (LOOK[G.material] || LOOK.normal).fill, 3); ctx.setLineDash([]);
  }
  if (st.raged) circle(e.x, e.y, r + 4, null, 'rgba(255,60,60,.85)', 2);
  if (num(st.burn) > 0) circle(e.x, e.y, r + 1, null, 'rgba(255,140,40,.9)', 2);
  if (num(st.poison) > 0) { ctx.setLineDash([3, 4]); circle(e.x, e.y, r + 4, null, '#8dff6a', 2); ctx.setLineDash([]); }

  // 이름표 + HP 바 (도트 칸 단위)
  const bw = snap(Math.max(72, r * 2.6)), bx = snap(e.x - bw / 2), by = snap(e.y - r - (e.boss ? 34 : 22));
  const p = Math.max(0, Math.min(1, num(e.hp) / Math.max(1, num(e.maxHp, 1))));
  rect(bx - 2, by - 2, bw + 4, 10, e.boss ? '#ffcf3a' : '#000000');
  rect(bx, by, bw, 6, '#2a0f0f');
  const segs = Math.round(bw / 4), on = Math.ceil(segs * p), hc = p > 0.5 ? '#5ee06a' : p > 0.2 ? '#ffd84a' : '#ff4a4a';
  if (on > 0) rect(bx, by, Math.min(bw, on * 4), 6, hc);
  if (on > 0) rect(bx, by, Math.min(bw, on * 4), 2, mix(hc, '#ffffff', 0.45));
  if (num(st.shield) > 0) rect(bx, by - 6, bw, 2, '#6cc8ff');
  const nameY = by - 12;
  texts.push({ k: 'name', t: e.name || '', hp: String(Math.max(0, Math.ceil(num(e.hp)))), x: e.x, y: nameY, boss: !!e.boss });

  // 상태 배지 (몸 아래)
  const badges = [];
  if (num(st.shield) > 0) badges.push(['보호' + Math.ceil(st.shield), '#6cc8ff']);
  if (num(st.freeze) > 0) badges.push(['빙결', '#bfefff']);
  if (num(st.burn) > 0) badges.push(['화상' + st.burn, '#ff9a40']);
  if (num(st.poison) > 0) badges.push(['독' + st.poison, '#8dff6a']);
  if (num(st.adapt) > 0) badges.push(['적응', '#d0a0ff']);
  if (st.raged) badges.push(['격노', '#ff5a5a']);
  if (badges.length) texts.push({ k: 'badges', list: badges, x: e.x, y: e.y + r + 14 });

  // 능력 예고 (깜빡이는 !)
  const warn = arr(e.abil).find((a) => a && a.warn);
  if (warn && Math.floor(t * 8) % 2 === 0) text('!', e.x + r + 10, e.y - r, 22, '#ffd84a');

  // 기울임: 화살표
  const tiltDir = num(st.tiltDir);
  if ((num(st.tilt) > 0 || (warn && warn.t === 'tilt')) && tiltDir) {
    const a = num(st.tilt) > 0 ? 0.9 : 0.45;
    for (const yy of [250, 380, 500]) {
      const cx = W / 2 + tiltDir * 40;
      ctx.strokeStyle = `rgba(255,216,74,${a})`; ctx.lineWidth = 4; ctx.lineCap = 'butt'; ctx.beginPath();
      ctx.moveTo(cx - tiltDir * 30, yy); ctx.lineTo(cx + tiltDir * 30, yy);
      ctx.moveTo(cx + tiltDir * 18, yy - 10); ctx.lineTo(cx + tiltDir * 30, yy); ctx.lineTo(cx + tiltDir * 18, yy + 10);
      ctx.stroke();
    }
  }
}

// ───────────── 공 ─────────────
const RAINBOW = ['#ff4a4a', '#ff9a40', '#ffe14d', '#7be08a', '#4fa8ff', '#9b5de5', '#ff7eb6', '#ffffff'];
function drawBall(b, mat, G) {
  const L = LOOK[mat] || LOOK.normal, r = num(b.r, 9), { x, y } = b;
  if (G && num(G.furyT) > 0) circle(x, y, r + 4, Math.floor(num(G.time) * 10) % 2 ? '#ff3030' : '#ffb030');   // 분노
  // 잔상
  let tr = trails.get(b);
  if (!tr) { tr = []; trails.set(b, tr); }
  tr.push([x, y]); if (tr.length > 4) tr.shift();
  for (let i = 0; i < tr.length - 1; i++) circle(tr[i][0], tr[i][1], r * (0.45 + i * 0.12), hexA(L.fill, 0.18 + i * 0.12));
  circle(x + 2, y + 3, r, 'rgba(0,0,0,.4)');
  circle(x, y, r + 1.4, L.edge);
  circle(x, y, r, L.fill);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.fillStyle = mix(L.fill, '#000000', 0.25); ctx.fillRect(x - r, y + r * 0.35, r * 2, r);
  ctx.restore();
  ctx.strokeStyle = L.mark; ctx.fillStyle = L.mark; ctx.lineWidth = 2; ctx.lineCap = 'butt';
  const k = r * 0.55;
  switch (L.pat) {
    case 'flame':
      ctx.beginPath(); ctx.moveTo(x - k * 0.7, y + k * 0.5); ctx.lineTo(x, y - k * 1.1); ctx.lineTo(x + k * 0.7, y + k * 0.5); ctx.closePath(); ctx.fill();
      break;
    case 'flake':
      sq(x, y, 2, L.mark); sq(x - k, y, 2, L.mark); sq(x + k, y, 2, L.mark); sq(x, y - k, 2, L.mark); sq(x, y + k, 2, L.mark);
      break;
    case 'rivet':
      for (const [a, c] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) sq(x + a * k * 0.7, y + c * k * 0.7, 2, L.mark);
      break;
    case 'band':
      rect(x - r * 0.85, y - 2, r * 1.7, 4, L.mark);
      break;
    case 'bubble':
      sq(x + k * 0.4, y - k * 0.3, 4, L.mark); sq(x - k * 0.5, y + k * 0.45, 2, L.mark);
      break;
    case 'zigzag':
      ctx.beginPath(); ctx.moveTo(x - k, y - k * 0.4); ctx.lineTo(x - k * 0.2, y + k * 0.4); ctx.lineTo(x + k * 0.2, y - k * 0.4); ctx.lineTo(x + k, y + k * 0.4); ctx.stroke();
      break;
    case 'swirl':
      ctx.beginPath(); ctx.arc(x, y, k, 0.2, Math.PI * 1.4); ctx.stroke();
      break;
    default: // shine
      sq(x - r * 0.35, y - r * 0.38, 4, '#ffffff');
  }
  const S = (G && G.stats) || {};
  if (S.blast && num(b.blastT) >= S.blast.every && Math.floor(num(G.time) * 8) % 2) {   // 폭발 준비됨
    circle(x, y, r + 3, null, '#ffb030', 2);
  }
  if (S.cell) {
    if (b.small) {                             // 남은 접촉 수 + 성장 진행
      const left = Math.max(0, S.cell.touches - num(b.touch));
      for (let i = 0; i < left; i++) sq(x - (left - 1) * 3 + i * 6, y - r - 6, 4, '#9dffa8');
      if (num(b.gen) < S.cell.maxGrow) {
        ctx.strokeStyle = hexA('#9dffa8', 0.7); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + 4, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, num(b.growT) / S.cell.grow)); ctx.stroke();
      }
    } else if (typeof b.cellHp === 'number' && num(b.gen) < S.cell.maxGrow) {   // 세포 체력 바
      const p = Math.max(0, Math.min(1, b.cellHp)), w = 20;
      rect(x - w / 2 - 2, y - r - 10, w + 4, 6, '#000000');
      rect(x - w / 2, y - r - 8, Math.max(2, w * p), 2, p > 0.5 ? '#7be08a' : p > 0.25 ? '#ffd84a' : '#ff4a4a');
    }
  }
  const rb = num(b.rb);                       // 무지개 충전 칸
  for (let i = 0; i < rb; i++) {
    const a = num(G && G.time) * 3 + (i / Math.max(1, rb)) * TAU;
    sq(x + Math.cos(a) * (r + 6), y + Math.sin(a) * (r + 6), 4, RAINBOW[i % RAINBOW.length]);
  }
}

function drawRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const q = rings[i]; q.life -= dt;
    if (q.life <= 0) { rings.splice(i, 1); continue; }
    const k = 1 - q.life / q.max;
    circle(q.x, q.y, q.r * (0.3 + 0.7 * k), hexA('#ff9a30', 0.35 * (1 - k)), k < 0.5 ? '#ffffff' : '#ffb030', 4 * (1 - k) + 1);
  }
}

function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt; if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    sq(q.x, q.y, q.life > 0.25 ? 4 : 2, q.c);
  }
}

// ───────────── 덧그리기: 픽셀 글꼴 ─────────────
function fontPx(size) {
  // 판이 작게 보일 때(가로 화면) 글자가 12px 아래로 줄지 않게 보정 (최대 1.8배)
  return Math.round(size * Math.min(1.8, Math.max(1, 0.85 / num(view.scale, 1))));
}
function otext(g, t, x, y, size, color, align = 'center') {
  const s = fontPx(size), o = Math.max(1, Math.round(s / 12));
  g.font = `${s}px ${FONT}`;
  g.textAlign = align; g.textBaseline = 'middle';
  g.fillStyle = '#000000';
  for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o], [o, o]]) g.fillText(t, x + dx, y + dy);
  g.fillStyle = color; g.fillText(t, x, y);
}
function flushTexts(g) {
  for (const q of texts) {
    if (q.k === 't') otext(g, q.t, q.x, q.y, q.size, q.color, q.align);
    else if (q.k === 'name') {
      const s = fontPx(12);
      g.font = `${s}px ${FONT}`;
      const label = (q.boss ? '보스 ' : '') + q.t, hp = q.hp;
      const wN = g.measureText(label).width, wH = g.measureText(hp).width, gap = 6, total = wN + gap + wH + 12;
      let x0 = Math.max(4, Math.min(W - 4 - total, q.x - total / 2));
      g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(Math.round(x0), Math.round(q.y - s / 2 - 3), Math.round(total), s + 6);
      g.fillStyle = q.boss ? '#ffcf3a' : '#5a6a60';
      g.fillRect(Math.round(x0), Math.round(q.y + s / 2 + 1), Math.round(total), 2);

  if (G.phase !== 'launch') return;
  power = Math.max(0, Math.min(1, power ?? G.plunger.charge));
  const b = G.balls.find((x) => x.rest) || G.balls[0];
  if (!b) return;
  b.rest = false;
  b.vy = -(C.LAUNCH_MIN + (C.LAUNCH_MAX - C.LAUNCH_MIN) * power);
  G.plunger.charge = 0; G.plunger.holding = false;
  G.launchT = 0;
  setPhase('play');
  const tw = G.stats.twin;                    // 쌍둥이 공
  if (tw && rng() < tw.chance) {
    const n = 1 + (rng() < tw.extra ? 1 : 0);
    for (let i = 0; i < n && G.balls.length < C.MULTI_MAX; i++) G.balls.push(makeBall(178 + (i ? 40 : -40), 80, i ? 220 : -220, 0));
    bus.emit('ability', { t: 'twin', label: n > 1 ? '세쌍둥이!' : '쌍둥이!', x: 178, y: 140 });
  }
  bus.emit('launch', { power });
}

// ───────────────────────── 데미지 (기획서 8장 A) ─────────────────────────
function armorFlat(e) {
  const a = e.abil.find((x) => x.t === 'armor');
  return a ? a.flat : 0;
}

function statusOn(name, on) { bus.emit('status', { status: name, on }); }

function applyMaterial(src) {
  const st = G.enemy.status, S = G.stats;
  const sp = (MATERIALS[G.material] || MATERIALS.normal).special;
  if (sp === 'burn') {
    if (st.burn === 0) statusOn('burn', true);
    st.burn = Math.min(STATUS.burn.max, st.burn + STATUS.burn.perHit);
    st.burnT = STATUS.burn.dur;
  } else if (sp === 'poison') {
    st.poisonHits++;
    if (st.poisonHits >= STATUS.poison.perHits) {
      st.poisonHits = 0;
      if (st.poison === 0) statusOn('poison', true);
      st.poison = Math.min(STATUS.poison.max, st.poison + 1);
    }
  } else if (sp === 'freeze') {
    if (st.freezeCd <= 0 && st.freeze <= 0 && rng() < S.freezeChance) {
      st.freeze = STATUS.freeze.dur; st.freezeCd = STATUS.freeze.cd;
      statusOn('freeze', true);
    }
  } else if (sp === 'chain' && src !== 'chain') {
    G.chainCount++;
    if (G.chainCount % STATUS.chain.every === 0) pendingChain = true;
  }
}

/** hit(src, obj, x, y, amt) — amt: burn/poison 틱 피해 */
function hit(src, obj, x, y, amt = 0) {
  const e = G.enemy;
  if (!e || e.hp <= 0 || G.phase !== 'play') return 0;
  // 1. 재타격 쿨다운
  if (obj) {
    const cd = src === 'lane' ? C.LANE_CD : C.HIT_CD;
    if (G.time - (obj._t ?? -99) < cd) return 0;
    obj._t = G.time;
  }
  const st = e.status, S = G.stats;
  const direct = DIRECT.has(src);
  const dot = src === 'burn' || src === 'poison';
  const fixed = src === 'echo' || src === 'piggy' || src === 'rainbow';   // amt 를 그대로 쓰는 특성 피해
  x = x ?? e.x; y = y ?? e.y;
  // 2. 재질 효과 (막혀도 적용)
  if (direct) applyMaterial(src);
  // 3. 보호막
  if (st.shield > 0 && (direct || src === 'burn')) {
    st.shield = Math.max(0, st.shield - S.shieldHits);
    bus.emit('hit', { x, y, amount: 0, kind: 'shield', src });
    if (st.shield === 0) statusOn('shield', false);
    flushChain();
    return 0;
  }
  // 4~5. 기본 × 출처 배수
  let raw;
  if (src === 'chain') raw = DAMAGE.bumper * S.chainMul;
  else if (dot) raw = amt * S.dotMul;
  else if (fixed) raw = amt;
  else {
    raw = DAMAGE[src] || 0;
    raw *= src === 'bumper' ? S.bumperMul : src === 'lane' ? S.laneMul
         : (src === 'target' || src === 'bank') ? S.targetMul : src === 'body' ? S.bodyMul : 1;
  }
  // 6. 공통 배수 + 특성
  if (!dot && !fixed) raw *= S.dmgMul;
  if (direct && S.comet && curBall && Math.hypot(curBall.vx, curBall.vy) >= S.comet.speed) raw *= S.comet.mul;
  if (direct && S.domino) raw *= 1 + Math.min(S.domino.max, G.combo * S.domino.step);
  if (!dot && !fixed && G.furyT > 0 && S.fury) raw *= S.fury.mul;
  // 7. 원소
  let kind = 'normal';
  if (direct && st.adapt > 0) { raw *= S.resistMul; kind = 'resist'; }
  else if (G.material !== 'normal' && G.material === e.weak) { raw *= S.weakMul; kind = 'weak'; }
  else if (G.material !== 'normal' && G.material === e.resist) { raw *= S.resistMul; kind = 'resist'; }
  // 8. 치명
  if (direct && rng() < S.critChance) { raw *= S.critMul; kind = 'crit'; }
  else if (direct) raw *= S.missMul;
  // 9. 빙결·마무리
  if (st.freeze > 0) raw *= STATUS.freeze.takenMul;
  if (S.reaper && e.hp <= e.maxHp * S.reaper.below) raw *= S.reaper.mul;
  // 10. 갑옷
  let dmg;
  if (direct) {
    const a = Math.max(0, armorFlat(e) - S.armorCut) * S.armorMul * (st.burn > 0 ? STATUS.burn.armorCut : 1);
    dmg = Math.max(DAMAGE.min, Math.round(raw - a));
  } else dmg = Math.max(DAMAGE.min, Math.round(raw));
  if (dot) kind = 'dot';
  // 11. 적용
  e.hp = Math.max(0, e.hp - dmg);
  G.score += dmg * C.SCORE_PER_DMG;
  bus.emit('hit', { x, y, amount: dmg, kind, src });
  if (direct) {
    G.combo++; G.ballDmg += dmg;
    if (S.fury && ++G.furyN >= S.fury.hits) {
      G.furyN = 0; G.furyT = S.fury.dur;
      bus.emit('ability', { t: 'fury', label: '분노 폭발!', x: e.x, y: e.y });
    }
  }
  if (S.reaper && S.reaper.kill && e.hp > 0 && e.hp <= e.maxHp * S.reaper.kill) {
    e.hp = 0;
    bus.emit('ability', { t: 'reap', label: '처형!', x: e.x, y: e.y });
  }
  const rage = e.abil.find((a) => a.t === 'rage');
  if (rage && !st.raged && e.hp > 0 && e.hp <= rage.at * e.maxHp) {
    st.raged = true;
    bus.emit('ability', { t: 'rage', label: ABIL_LABEL.rage, x: e.x, y: e.y });
  }
  if (e.hp <= 0) { pendingChain = false; defeat(); return dmg; }
  flushChain();
  return dmg;
}

function flushChain() {
  if (!pendingChain) return;
  pendingChain = false;
  const e = G.enemy;
  for (const g of e.guards) g.hp -= 1;
  e.guards = e.guards.filter((g) => g.hp > 0);
  hit('chain', null, e.x, e.y);
}

function hitGuard(g) {
  if (G.time - (g._t ?? -99) < C.HIT_CD) return;
  g._t = G.time;
  g.hp -= G.stats.guardHits;
  bus.emit('hit', { x: g.x, y: g.y, amount: 0, kind: 'shield', src: 'guard' });
  if (g.hp <= 0) G.enemy.guards = G.enemy.guards.filter((x) => x !== g);
}

function defeat() {
  const e = G.enemy;
  const bonus = C.SCORE_STAGE * G.stage + (e.boss ? C.SCORE_BOSS : 0);
  bus.emit('enemyDefeated', { stage: G.stage, boss: e.boss, bonus, x: e.x, y: e.y, balls: G.balls.map((b) => ({ x: b.x, y: b.y })) });
  G.score += bonus;
  if (e.boss) G.ballsLeft = Math.min(C.MAX_BALLS, G.ballsLeft + C.BOSS_BALL);
  G.balls = [];
  G.blastQ = [];
  for (const k of ['L', 'R']) G.flippers[k].up = false;
  // 바로 카드로 가지 않고 쓰러지는 연출 (render.js 가 G.dieT 로 그림) → afterDefeat
  G.dieT = 0; G.dieDur = e.boss ? C.DIE_TIME_BOSS : C.DIE_TIME;
  saveBest();
  setPhase('dying');
}

function afterDefeat() {
  if (G.stage >= C.STAGES) {
    saveBest();
    setPhase('victory');
    bus.emit('victory', { score: G.score, best: G.best });
    return;
  }
  saveBest();
  G.cards = rollCards(G, rng);
  setPhase('cards');
  bus.emit('cards', { cards: G.cards });
}

function chooseCard(i) {
  if (G.phase !== 'cards') return;
  const card = G.cards[i];
  if (!card) return;
  if (card.kind === 'material') {
    if (!G.materials.includes(card.id)) G.materials.push(card.id);
    G.material = card.id;
  }
  else if (card.kind === 'trait') {
    G.traitLv = G.traitLv || {};
    if (G.traits.includes(card.id)) {          // 같은 특성을 또 고름 → 3번째에 각성
      const n = Math.min(TRAIT_AWAKEN, (G.traitLv[card.id] || 1) + 1);
      G.traitLv[card.id] = n;
      if (n === TRAIT_AWAKEN) bus.emit('traitAwake', { id: card.id });
    } else if (G.traits.length < 4) { G.traits.push(card.id); G.traitLv[card.id] = 1; }
  }
  else if (card.kind === 'upgrade') {
    G.upgrades[card.id] = (G.upgrades[card.id] || 0) + 1;
    if (card.id === 'extraBall') G.ballsLeft = Math.min(C.MAX_BALLS, G.ballsLeft + 1);
  }
  G.stats = calcStats(G);
  bus.emit('cardChosen', { card });
  startStage(G.stage + 1);
}

// ───────────────────────── 적 이동·능력 (8장 B) ─────────────────────────
function abilOf(t) { return G.enemy.abil.find((a) => a.t === t); }

function moveEnemy(dt) {
  const e = G.enemy;
  if (!e) return;
  const st = e.status;
  const ox = e.x, oy = e.y;
  const frozen = st.freeze > 0;
  const mv = abilOf('move');
  const rage = abilOf('rage');
  if (mv) {
    if (!frozen) e.t += dt * (st.raged && rage ? rage.spdMul : 1);
    e.x = e.x0 + mv.ax * Math.sin(mv.spd * e.t);
    e.y = e.y0 + mv.ay * Math.sin(2 * mv.spd * e.t);
  } else { e.x = e.x0; e.y = e.y0; }
  const lim = (v) => Math.max(-C.ENTITY_MAX_V, Math.min(C.ENTITY_MAX_V, v));
  e.vx = lim((e.x - ox) / dt); e.vy = lim((e.y - oy) / dt);
  const g = abilOf('guard');
  if (g) {
    for (const q of e.guards) {
      if (!frozen) q.ang += g.spd * dt * (st.raged && rage ? rage.spdMul : 1);
      const nx = e.x + Math.cos(q.ang) * g.orbit, ny = e.y + Math.sin(q.ang) * g.orbit;
      q.vx = lim((nx - q.x) / dt); q.vy = lim((ny - q.y) / dt);
      q.x = nx; q.y = ny;
    }
  }
}

function warnStart(a) {
  const st = G.enemy.status;
  if (a.t === 'tilt') st.tiltDir = rng() < 0.5 ? -1 : 1;
  if (a.t === 'jam') st.jamSide = rng() < 0.5 ? 'L' : 'R';
}

function triggerAbility(a) {
  const e = G.enemy, st = e.status, S = G.stats;
  switch (a.t) {
    case 'shield':
      if (st.shield <= 0) statusOn('shield', true);
      st.shield = Math.max(st.shield, a.hits); break;
    case 'heal': {
      const amt = e.maxHp * a.pct * (1 - S.healCut) * (st.poison > 0 ? 1 - STATUS.poison.healCut : 1);
      e.hp = Math.min(e.maxHp, e.hp + Math.round(amt)); break;
    }
    case 'guard':
      if (e.guards.length < a.n) {
        const ang = e.guards.length ? e.guards[0].ang + Math.PI : 0;
        e.guards.push({ x: e.x + Math.cos(ang) * a.orbit, y: e.y + Math.sin(ang) * a.orbit,
                        r: C.GUARD_R, vx: 0, vy: 0, ang, hp: C.GUARD_HITS });
      } else return false;   // 보충할 게 없으면 조용히
      break;
    case 'tp': {
      const n = (e.tpIdx + 1) % a.pts.length;
      const [tx, ty] = a.pts[n];
      if (G.balls.some((b) => !b.rest && Math.hypot(b.x - tx, b.y - ty) < e.r + 30)) { a.timer = 0.1; return null; }
      e.tpIdx = n; e.x0 = tx; e.y0 = ty; break;
    }
    case 'push':
      for (const b of G.balls) {
        if (b.rest || b.inLane) continue;
        const dx = b.x - e.x, dy = b.y - e.y, d = Math.hypot(dx, dy);
        if (d < a.radius && d > 0.01) {
          const f = a.power * (1 - d / a.radius) * S.forceMul;
          b.vx += dx / d * f; b.vy += dy / d * f;
        }
      }
      break;
    case 'tilt':
      if (!st.tiltDir) st.tiltDir = rng() < 0.5 ? -1 : 1;
      st.tilt = a.dur; st.tiltAx = a.ax; statusOn('tilt', true); break;
    case 'jam':
      if (!st.jamSide) st.jamSide = rng() < 0.5 ? 'L' : 'R';
      if (!S.jamImmune) { st.jam = a.dur; statusOn('jam', true); }
      break;
    case 'adapt':
      if (S.adaptImmune) return false;        // 고요한 마음 ★
      st.adapt = a.dur; statusOn('adapt', true); break;
    default: return false;
  }
  bus.emit('ability', { t: a.t, label: ABIL_LABEL[a.t] || a.t, x: e.x, y: e.y });
  return true;
}

function updateAbilities(dt) {
  const e = G.enemy, st = e.status;
  if (st.freeze > 0) return;            // 빙결 중 타이머 정지
  const rage = abilOf('rage');
  for (const a of e.abil) {
    if (!a.every || a.t === 'move' || a.t === 'armor' || a.t === 'rage') continue;
    const prevWarn = a.warn;
    a.timer -= dt;
    a.warn = a.timer <= C.ABIL_WARN ? 1 : 0;
    if (a.warn && !prevWarn) warnStart(a);
    if (a.timer <= 0) {
      const r = triggerAbility(a);
      if (r === null) continue;         // tp 미룸
      a.timer = a.every * G.stats.cdMul * (st.raged && rage ? rage.cdMul : 1);
      a.warn = 0;
    }
  }
}

function updateStatus(dt) {
  const e = G.enemy, st = e.status, S = G.stats;
  if (st.freeze > 0) { st.freeze -= dt; if (st.freeze <= 0) { st.freeze = 0; statusOn('freeze', false); } }
  if (st.freezeCd > 0) st.freezeCd -= dt;
  if (st.burn > 0) {
    st.burnT -= dt;
    st.burnTick = (st.burnTick || 0) + dt;
    if (st.burnTick >= STATUS.burn.tick) {
      st.burnTick -= STATUS.burn.tick;
      hit('burn', null, e.x, e.y, st.burn * STATUS.burn.dmg * S.specialScale);
      if (G.phase !== 'play') return;
    }
    if (st.burnT <= 0) { st.burn = 0; st.burnTick = 0; statusOn('burn', false); }
  }
  if (st.poison > 0) {
    st.poisonTick = (st.poisonTick || 0) + dt;
    if (st.poisonTick >= STATUS.poison.tick) {
      st.poisonTick -= STATUS.poison.tick;
      hit('poison', null, e.x, e.y, st.poison * STATUS.poison.dmg * S.specialScale);
      if (G.phase !== 'play') return;
    }
  }
  for (const k of ['tilt', 'jam', 'adapt']) {
    if (st[k] > 0) {
      st[k] -= dt;
      if (st[k] <= 0) {
        st[k] = 0; statusOn(k, false);
        if (k === 'tilt') st.tiltDir = 0;
        if (k === 'jam') st.jamSide = '';
      }
    }
  }
}

// ───────────────────────── 물리 ─────────────────────────
function emitBump(x, y, type, strength) { bus.emit('bump', { x, y, type, strength: Math.min(1, strength) }); }

function flipperUpdate(dt) {
  const st = G.enemy ? G.enemy.status : null;
  for (const k of ['L', 'R']) {
    const f = G.flippers[k], bf = board.flippers[k];
    let want = f.up;
    if (st && st.jam > 0 && st.jamSide === k) want = false;
    const target = want ? bf.up : bf.rest;
    const step = C.FLIPPER_SPEED * dt;
    const d = target - f.angle;
    const old = f.angle;
    f.angle = Math.abs(d) <= step ? target : f.angle + Math.sign(d) * step;
    f.av = (f.angle - old) / dt;
  }
}

// 무한 튕김 방지: 플리퍼에 닿지 않고 KICK_FREE 회를 넘게 연속으로 튕기면 차내는 힘이 점점 약해진다
function kickFactor(b) {
  const n = (b.kicks || 0) - KICK_FREE;
  return n <= 0 ? 1 : Math.max(0, Math.pow(KICK_DECAY, n));
}

function collideBall(b) {
  const S = G.stats, e = G.enemy;
  // 벽
  for (const w of board.walls) {
    if (w.gate && b.inLane) continue;
    const c = hitCapsule(b, w.x1, w.y1, w.x2, w.y2, w.r, { bounce: C.WALL_BOUNCE, jitter: w.map ? JITTER : 0 });
    if (c && c.vn < -250 && G.time - b.wallT > 0.08) { b.wallT = G.time; emitBump(b.x, b.y, 'wall', -c.vn / 1500); }
  }
  if (b.inLane) return;
  // 슬링샷
  for (const s of board.slings) {
    const c = hitCapsule(b, s.x1, s.y1, s.x2, s.y2, s.r, { bounce: 0.5, kick: C.SLING_KICK * S.kickMul * kickFactor(b), jitter: JITTER });
    if (c) { b.kicks++; s.flash = 1; emitBump(b.x, b.y, 'sling', 0.8); }
  }
  // 범퍼 (판마다 다른 장애물 — board.gimmick)
  for (const p of board.bumpers) {
    if (p.broken > 0) continue;
    const kick = C.BUMPER_KICK * S.kickMul * kickFactor(b);
    let c;
    if (p.kind === 'spin') {
      const gm = GIMMICKS.spin, L = p.r0 + gm.extra, ca = Math.cos(p.ang) * L, sa = Math.sin(p.ang) * L;
      c = hitCapsule(b, p.x - ca, p.y - sa, p.x + ca, p.y + sa, gm.w,
        { bounce: 0.55, kick: kick * 0.75, omega: p.av || 0, px: p.x, py: p.y, jitter: JITTER });
      if (!c) c = hitCircle(b, p.x, p.y, 7, { bounce: 0.55, kick: kick * 0.75, jitter: JITTER });
    } else {
      const big = p.kind === 'pulse' ? Math.max(0.8, p.r / p.r0) : 1;
      c = hitCircle(b, p.x, p.y, p.r, { bounce: 0.6, kick: kick * big, vx: p.vx, vy: p.vy, maxV: C.ENTITY_MAX_V, jitter: JITTER });
    }
    if (c) {
      b.kicks++; p.flash = 1; emitBump(p.x, p.y, 'bumper', 1);
      const fresh = G.time - (p._t ?? -99) >= C.HIT_CD;
      const dealt = hit('bumper', p, p.x, p.y);
      if (G.phase !== 'play') return;
      if (dealt > 0 && S.echo && rng() < S.echo.chance) {       // 메아리 범퍼
        hit('echo', null, p.x, p.y - 12, dealt * S.echo.mul);
        if (G.phase !== 'play') return;
      }
      if (p.kind === 'crumble' && fresh) {
        p.hp--;
        if (p.hp <= 0) {                 // 부서짐: 큰 피해, 잠시 뒤 다시 생김
          p.broken = GIMMICKS.crumble.respawn;
          bus.emit('crumble', { x: p.x, y: p.y, r: p.r });
          hit('bank', null, p.x, p.y);
          if (G.phase !== 'play') return;
        }
      }
    }
  }
  // 드롭 타깃
  for (const t of board.targets) {
    if (t.down) continue;
    const c = hitCapsule(b, t.x1, t.y1, t.x2, t.y2, t.r, { bounce: 0.5 });
    if (c) {
      t.down = true; t.timer = S.targetReset; t.flash = 1;
      emitBump((t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, 'target', 0.9);
      hit('target', t, (t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2);
      if (G.phase !== 'play') return;
      if (board.targets.every((q) => q.down)) {
        hit('bank', null, (t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2);
        if (G.phase !== 'play') return;
        for (const q of board.targets) { q.down = false; q.timer = 0; q.flash = 1; }
      }
    }
  }
  // 적 몸체
  if (e && e.hp > 0) {
    const c = hitCircle(b, e.x, e.y, e.r, { bounce: 0.6, kick: 260 * kickFactor(b), vx: e.vx, vy: e.vy, maxV: C.ENTITY_MAX_V, jitter: JITTER });
    if (c) {
      b.kicks++; emitBump(b.x, b.y, 'wall', 0.6); hit('body', e, b.x - c.nx * b.r, b.y - c.ny * b.r);
      if (G.phase !== 'play') return;
      if (b.small && G.time - (b.touchT ?? -99) > 0.15) {   // 세포: 작은 공은 3번 닿으면 죽음, 성장 시간 초기화
        b.touchT = G.time; b.touch = (b.touch || 0) + 1; b.growT = 0;
        if (b.touch >= (S.cell ? S.cell.touches : 3)) { b.alive = false; bus.emit('cellPop', { x: b.x, y: b.y }); }
      }
      if (S.rainbow && b.rb > 0) {             // 무지개 충전 터뜨리기
        const amt = DAMAGE.body * S.bodyMul * S.dmgMul * b.rb * S.rainbow.mul;
        bus.emit('ability', { t: 'rainbow', label: `무지개 ×${b.rb}`, x: e.x, y: e.y });
        b.rb = 0;
        hit('rainbow', null, e.x, e.y - e.r, amt);
        if (G.phase !== 'play') return;
      }
    }
    for (const g of e.guards.slice()) {
      const c2 = hitCircle(b, g.x, g.y, g.r, { bounce: 0.6, kick: 220 * kickFactor(b), vx: g.vx, vy: g.vy, maxV: C.ENTITY_MAX_V, jitter: JITTER });
      if (c2) { b.kicks++; hitGuard(g); }
    }
  }
  // 플리퍼
  for (const k of ['L', 'R']) {
    const f = G.flippers[k], bf = board.flippers[k];
    const tx = bf.px + Math.cos(f.angle) * bf.len, ty = bf.py + Math.sin(f.angle) * bf.len;
    const c = hitCapsule(b, bf.px, bf.py, tx, ty, bf.r, { bounce: 0.3, omega: f.av, px: bf.px, py: bf.py });
    if (c) { b.kicks = 0; G.combo = 0; }   // 플리퍼에 닿으면 튕김 힘 원상 복구, 도미노 초기화
    if (c && Math.abs(f.av) > 1 && c.vn < -100) emitBump(b.x, b.y, 'flipper', Math.abs(f.av) / C.FLIPPER_SPEED);
  }
  // 레인 (통과형)
  for (const l of board.lanes) {
    if (inRect(b.x, b.y, l.x, l.y, l.w, l.h) && G.time - (l._t ?? -99) >= C.LANE_CD) {
      l.lit = 1; emitBump(l.x + l.w / 2, l.y + l.h / 2, 'lane', 0.5);
      if (S.rainbow) b.rb = Math.min(S.rainbow.max, (b.rb || 0) + 1);
      hit('lane', l, l.x + l.w / 2, l.y + l.h / 2);
      if (G.phase !== 'play') return;
    }
  }
}

// 장애물 움직임 (board.gimmick) — 서브스텝마다
function updateGimmicks(dt) {
  board.gt = (board.gt || 0) + dt;
  const t = board.gt, frozen = G.enemy && G.enemy.status.freeze > 0;
  for (const p of board.bumpers) {
    if (p.kind === 'pulse') {
      const g = GIMMICKS.pulse;
      p.r = p.r0 * (1 + g.amp * Math.sin(t * g.spd + p.ph));
    } else if (p.kind === 'orbit') {
      const g = GIMMICKS.orbit, a = t * g.spd;     // 모두 같은 위상: 서로 사이 간격은 그대로
      const nx = p.x0 + Math.cos(a) * g.rad, ny = p.y0 + Math.sin(a) * g.rad;
      p.vx = (nx - p.x) / dt; p.vy = (ny - p.y) / dt; p.x = nx; p.y = ny;
    } else if (p.kind === 'spin') {
      p.av = frozen ? 0 : GIMMICKS.spin.spd; p.ang += p.av * dt;
    } else if (p.kind === 'crumble' && p.broken > 0) {
      p.broken -= dt;
      if (p.broken <= 0) {
        const near = G.balls.some((b) => Math.hypot(b.x - p.x, b.y - p.y) < p.r + b.r + 4);
        if (near) p.broken = 0.2;                  // 공이 겹쳐 있으면 조금 뒤에
        else { p.broken = 0; p.hp = GIMMICKS.crumble.hits; p.flash = 1; }
      }
    }
  }
}

function physicsStep(dt) {
  flipperUpdate(dt);
  if (G.phase !== 'play') return;
  moveEnemy(dt);
  updateGimmicks(dt);
  const S = G.stats, e = G.enemy, st = e.status;
  for (const b of G.balls) {
    if (!b.alive || b.rest) continue;
    b.vy += C.GRAVITY * (S.feather && b.vy < 0 && !b.inLane ? 1 - S.feather.cut : 1) * dt;   // 깃털 공
    if (!b.inLane) {
      if (st.tilt > 0) b.vx += (st.tiltAx || 0) * st.tiltDir * S.forceMul * dt;
      if (board.gimmick === 'whirl') {               // 소용돌이: 범퍼 쪽으로 끌림
        const g = GIMMICKS.whirl;
        for (const p of board.bumpers) {
          const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy), R = p.r + g.range;
          if (d < R && d > p.r) { const f = g.pull * (1 - (d - p.r) / g.range) * S.forceMul; b.vx += dx / d * f * dt; b.vy += dy / d * f * dt; }
        }
      }
    }
    clampSpeed(b, S.maxSpeed);
    b.x += b.vx * dt; b.y += b.vy * dt;
    curBall = b;
    collideBall(b);
    curBall = null;
    if (G.phase !== 'play') return;
    if (b.inLane) {
      b.laneT = (b.laneT || 0) + dt;
      if (b.x >= 328 && b.laneT > LANE_STUCK && G.balls.length === 1) { toLaunch(); return; }   // 레인에 갇힘 → 다시 발사대로(공 잃지 않음)
      if (b.x < 328) { b.inLane = false; b.r = S.ballR; }
      else if (b.y > board.plunger.y && b.vy > 0) {   // 레인으로 떨어져 돌아온 공 → 자동 재발사
        b.y = board.plunger.y; b.vx = 0; b.vy = -C.LAUNCH_MAX * 0.9;
      }
    }
    if (b.y > board.drainY || b.x < -50 || b.x > C.W + 50) b.alive = false;
  }
  if (G.balls.some((b) => !b.alive)) {
    G.balls = G.balls.filter((b) => b.alive);
    if (!G.balls.length) lastBallLost();
  }
}

function lastBallLost() {
  const S = G.stats;
  if (S.saveSec > 0 && G.launchT < S.saveSec) {
    G.saveFlash = 1.5;
    bus.emit('ballLost', { left: G.ballsLeft, saved: true });
    toLaunch();
    return;
  }
  if (S.piggy && G.ballDmg > 0 && G.enemy && G.enemy.hp > 0) {   // 저금통: 처치하면 공을 잃지 않음
    const amt = G.ballDmg * S.piggy.pct;
    G.ballDmg = 0;
    bus.emit('ability', { t: 'piggy', label: '저금통 와장창!', x: G.enemy.x, y: G.enemy.y });
    hit('piggy', null, G.enemy.x, G.enemy.y, amt);
    if (G.phase !== 'play') return;
  }
  if (G.ballsLeft > 0) {
    G.ballsLeft--;
    bus.emit('ballLost', { left: G.ballsLeft });
    toLaunch();
  } else {
    bus.emit('ballLost', { left: -1 });
    saveBest();
    setPhase('gameover');
    bus.emit('gameover', { stage: G.stage, score: G.score, best: G.best });
  }
}

// ───────────────────────── 프레임 갱신 ─────────────────────────
let acc = 0;
function update(dt) {
  if (!G) return;
  if (G.phase === 'dying') {          // 적 쓰러지는 연출
    G.time += dt; G.dieT += dt;
    if (G.dieT >= G.dieDur) afterDefeat();
    return;
  }
  if (G.phase !== 'launch' && G.phase !== 'play') return;
  G.time += dt;
  readInput();
  if (G.phase === 'launch' && G.plunger.holding) G.plunger.charge = Math.min(1, G.plunger.charge + dt / C.CHARGE_TIME);
  acc += dt;
  while (acc >= SUB) {
    acc -= SUB;
    physicsStep(SUB);
    if (G.phase !== 'play' && G.phase !== 'launch') { acc = 0; break; }
  }
  // 감쇠
  for (const p of board.bumpers) p.flash = Math.max(0, p.flash - dt * 4);
  for (const s of board.slings) s.flash = Math.max(0, s.flash - dt * 4);
  for (const l of board.lanes) l.lit = Math.max(0, l.lit - dt * 2);
  for (const t of board.targets) {
    t.flash = Math.max(0, t.flash - dt * 4);
    if (t.down) { t.timer -= dt; if (t.timer <= 0) { t.down = false; t.timer = 0; } }
  }
  if (G.saveFlash > 0) G.saveFlash = Math.max(0, G.saveFlash - dt);
  if (G.phase !== 'play') return;
  G.launchT += dt;
  updateStatus(dt);
  if (G.phase !== 'play') return;
  updateAbilities(dt);
  if (G.furyT > 0) G.furyT = Math.max(0, G.furyT - dt);   // 분노 게이지
  traitBalls(dt);
  if (G.phase !== 'play') return;
  // 끼임 방지
  for (const b of G.balls) {
    if (b.rest) continue;
    // 무한 튕김 방지: 빠르게 튕기더라도 좁은 구역(반경 LOOP_R)에 LOOP_TIME 이상 머물면 옆으로 빼낸다
    if (!b.inLane) {
      if (b.loopT === undefined || Math.hypot(b.x - b.loopX, b.y - b.loopY) > LOOP_R) {
        b.loopX = b.x; b.loopY = b.y; b.loopT = 0;
      } else if (b.y < LOOP_SAFE_Y) {          // 플리퍼 위에 공을 잡아 둔 경우는 제외
        b.loopT += dt;
        if (b.loopT > LOOP_TIME) {
          const dir = b.x < C.W / 2 - 20 ? 1 : -1;   // 판 가운데 쪽으로
          b.vx = dir * (220 + rng() * 120);
          b.vy = 120 + rng() * 80;                   // 아래로 빠지게
          b.loopT = 0; b.loopX = b.x; b.loopY = b.y;
        }
      } else b.loopT = 0;
    }
    if (Math.hypot(b.vx, b.vy) < 30) {
      b.slowT += dt;
      if (b.slowT > C.STUCK_TIME) {
        const a = rng() * Math.PI * 2;
        b.vx += Math.cos(a) * 200; b.vy += Math.sin(a) * 200 - 100; b.slowT = 0;
      }
    } else b.slowT = 0;
  }
}

// ───────────────────────── 공 특성: 폭발 · 세포 ─────────────────────────
function blastAt(x, y, depth) {
  const S = G.stats, e = G.enemy;
  if (!S.blast || !e || e.hp <= 0 || G.phase !== 'play') return;
  bus.emit('blast', { x, y, r: S.blast.range + 20, depth });
  if (depth > 0) bus.emit('ability', { t: 'blast', label: `연쇄 폭발 ×${depth + 1}`, x: e.x, y: e.y });
  hit('blast', null, e.x, e.y);
  if (G.phase !== 'play') return;
  if (S.blast.chain && rng() < S.blast.chain) G.blastQ.push({ t: 0.25, x: x + (rng() - 0.5) * 40, y: y + (rng() - 0.5) * 40, depth: depth + 1 });
}

function traitBalls(dt) {
  const S = G.stats, e = G.enemy;
  // 연쇄 폭발 대기열
  for (let i = G.blastQ.length - 1; i >= 0; i--) {
    const q = G.blastQ[i];
    q.t -= dt;
    if (q.t <= 0) { G.blastQ.splice(i, 1); blastAt(q.x, q.y, q.depth); if (G.phase !== 'play') return; }
  }
  const born = [];
  for (const b of G.balls) {
    if (!b.alive || b.rest || b.inLane) continue;
    // 폭발: 7.25초가 차 있고 적 주위에 있으면 펑
    if (S.blast && e && e.hp > 0) {
      b.blastT = Math.min(S.blast.every, (b.blastT || 0) + dt);
      if (b.blastT >= S.blast.every && Math.hypot(b.x - e.x, b.y - e.y) - e.r - b.r < S.blast.range) {
        b.blastT = 0;
        blastAt(b.x, b.y, 0);
        if (G.phase !== 'play') return;
      }
    }
    // 세포
    const cl = S.cell;
    if (!cl) continue;
    if (b.small) {
      b.growT = (b.growT || 0) + dt;
      if (b.growT >= cl.grow && (b.gen || 0) < cl.maxGrow) {
        b.small = false; b.r = S.ballR; b.cellHp = 1; b.gen = (b.gen || 0) + 1; b.touch = 0; b.growT = 0;
        bus.emit('ability', { t: 'cellGrow', label: '성장!', x: b.x, y: b.y });
      }
    } else if ((b.gen || 0) < cl.maxGrow) {
      if (b.cellHp === undefined) b.cellHp = 1;
      b.cellHp -= dt / cl.life;
      if (b.cellHp <= 0) {                         // 분열: 작은 공 2개
        b.alive = false;
        const sp = Math.max(250, Math.hypot(b.vx, b.vy)), a = Math.atan2(b.vy, b.vx);
        for (const s of [-1, 1]) {
          const n = makeBall(b.x + s * 5, b.y, Math.cos(a + s * 0.5) * sp, Math.sin(a + s * 0.5) * sp);
          n.r = S.ballR * cl.smallR; n.small = true; n.touch = 0; n.growT = 0; n.gen = b.gen || 0;
          born.push(n);
        }
        bus.emit('ability', { t: 'cellSplit', label: '분열!', x: b.x, y: b.y });
      }
    }
  }
  if (born.length || G.balls.some((b) => !b.alive)) {
    G.balls = G.balls.filter((b) => b.alive).concat(born);
    if (!G.balls.length) lastBallLost();
  }
}

// ───────────────────────── 입력 (구조.md 7장) ─────────────────────────
const pointers = new Map();   // pointerId → 'L' | 'R' | 'launch'
const keys = new Set();

function readInput() {
  let L = keys.has('L'), Rr = keys.has('R');
  for (const v of pointers.values()) { if (v === 'L') L = true; if (v === 'R') Rr = true; }
  G.flippers.L.up = L; G.flippers.R.up = Rr;
  if (G.phase === 'launch') {
    G.plunger.holding = keys.has('launch') || [...pointers.values()].includes('launch');
  }
}

let view = { cssW: C.W, cssH: C.H, dpr: 1, scale: 1, offX: 0, offY: 0 };
const stageEl = document.getElementById('stage');
const canvas = document.getElementById('board');

function boardX(clientX) {
  const rect = (stageEl || document.body).getBoundingClientRect();
  return (clientX - rect.left - view.offX) / view.scale;
}

function isUiTarget(t) {
  return t && t.closest && t.closest('button, a, input, select, label, [data-ui], .ui-block');
}

function onPointerDown(ev) {
  if (isUiTarget(ev.target)) return;
  if (!G) return;
  if (G.phase === 'title' && !U) { api.start(); return; }
  if (G.phase === 'launch') { pointers.set(ev.pointerId, 'launch'); G.plunger.holding = true; }
  else if (G.phase === 'play') pointers.set(ev.pointerId, boardX(ev.clientX) < C.W / 2 ? 'L' : 'R');
  else return;
  try { ev.currentTarget.setPointerCapture && ev.currentTarget.setPointerCapture(ev.pointerId); } catch { /* ignore */ }
  ev.preventDefault();
}
function onPointerUp(ev) {
  const v = pointers.get(ev.pointerId);
  pointers.delete(ev.pointerId);
  if (v === 'launch' && G.phase === 'launch' && ev.type === 'pointerup') launch(G.plunger.charge);
}

const KEYMAP = { ArrowLeft: 'L', KeyZ: 'L', ArrowRight: 'R', KeyM: 'R', Space: 'launch' };
function onKeyDown(ev) {
  if (!G) return;
  if (ev.code === 'KeyP' || ev.code === 'Escape') { G.phase === 'paused' ? api.resume() : api.pause(); ev.preventDefault(); return; }
  if ((ev.code === 'Space' || ev.code === 'Enter') && G.phase === 'title' && !U) { api.start(); ev.preventDefault(); return; }
  const k = KEYMAP[ev.code];
  if (!k) return;
  ev.preventDefault();
  if (ev.repeat) return;
  if (k === 'launch') { if (G.phase === 'launch') keys.add('launch'); }
  else keys.add(k);
}
function onKeyUp(ev) {
  const k = KEYMAP[ev.code];
  if (!k) return;
  keys.delete(k);
  if (k === 'launch' && G && G.phase === 'launch') { launch(G.plunger.charge); }
}

// ───────────────────────── API (ui.js) ─────────────────────────
const api = {
  start() { if (G.phase === 'title' || G.phase === 'gameover' || G.phase === 'victory') { newRun(); startStage(1); } },
  pause() { if (G.phase === 'launch' || G.phase === 'play') { G.pausedFrom = G.phase; pointers.clear(); keys.clear(); setPhase('paused'); } },
  resume() { if (G.phase === 'paused') setPhase(G.pausedFrom || 'launch'); },
  chooseCard,
  restart() { newRun(); startStage(1); },
  toTitle() { newRun(); G.enemy = null; board = buildBoard(null); setPhase('title'); },
  setMuted(m) { G.muted = !!m; store.set('bb.muted', G.muted); },
  getG: () => G,
  getBoard: () => board,
};

// ───────────────────────── view·부트스트랩 ─────────────────────────
function computeView() {
  const el = stageEl || document.body;
  const rect = el.getBoundingClientRect();
  const cssW = Math.max(1, rect.width || C.W), cssH = Math.max(1, rect.height || C.H);
  const scale = Math.min(cssW / C.W, cssH / C.H);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  view = { cssW, cssH, dpr, scale, offX: (cssW - C.W * scale) / 2, offY: (cssH - C.H * scale) / 2 };
  if (canvas) {
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  }
  if (R && R.resizeRender) { try { R.resizeRender(view); } catch (e) { console.error(e); } }
}

let renderErr = false;
function frame(dt) {
  if (R && R.drawFrame) {
    try { R.drawFrame(G, board, dt); } catch (e) { if (!renderErr) { renderErr = true; console.error('[drawFrame]', e); } }
  }
  if (U && U.updateUI) {
    try { U.updateUI(G); } catch (e) { if (!renderErr) { renderErr = true; console.error('[updateUI]', e); } }
  }
}

if (DEBUG) {
  window.__bb = {
    goto(n) { if (!G) newRun(); n = Math.max(1, Math.min(C.STAGES, n | 0)); pointers.clear(); keys.clear(); G.balls = []; startStage(n); return G.enemy.name; },
    launch(p = 1) { if (G.phase !== 'launch') return false; launch(p); return true; },
    damage(n) { const e = G.enemy; if (!e || G.phase !== 'play') return 0; e.hp = Math.max(0, e.hp - n); bus.emit('hit', { x: e.x, y: e.y, amount: n, kind: 'normal', src: 'debug' }); if (e.hp <= 0) defeat(); return e.hp; },
    step(sec = 1) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { update(1 / 60); } return G.phase; },
    flip(side, down = true) { if (down) keys.add(side); else keys.delete(side); },
    api, hit: (src) => hit(src, null), trigger: (t) => { const a = G.enemy.abil.find((x) => x.t === t); return a ? triggerAbility(a) : false; },
    get G() { return G; }, set G(v) { /* 읽기 전용 */ },
    get board() { return board; }, set board(v) { /* 읽기 전용 */ },
    view: () => view,
  };
}

newRun();
G.phase = 'title';
if (R && R.initRender && canvas) { try { R.initRender(canvas); } catch (e) { console.error(e); } }
computeView();
if (typeof ResizeObserver !== 'undefined' && stageEl) new ResizeObserver(computeView).observe(stageEl);
window.addEventListener('resize', computeView);
if (U && U.initUI) { try { U.initUI(api); } catch (e) { console.error(e); } }

const inputEl = stageEl || window;
inputEl.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', () => { pointers.clear(); keys.clear(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) api.pause(); });
bus.emit('phase', { phase: 'title', prev: null });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  frame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

return {  };
})();

})();
</script>
</body>
</html>
